    <stop offset="100%" stop-color="#3dd6c6" stop-opacity="0"/>
  </radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<rect width="1600" height="700" rx="34" fill="url(#bg)"/>
<rect width="1600" height="700" rx="34" fill="url(#glow)"/>

